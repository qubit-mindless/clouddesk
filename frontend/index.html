<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudDesk</title>
    <!-- Zatrzymane animowane tło ustawiamy przed pierwszym malowaniem (inaczej mignęłoby i pobrało animację).
         Klucz jak w src/hooks/useBackgroundAnimation.ts. -->
    <script>
      try {
        if (localStorage.getItem('clouddesk.backgroundAnimation') === 'paused') document.documentElement.dataset.background = 'paused'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
