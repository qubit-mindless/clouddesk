# CI (Blok 7): przy każdym pushu na main i każdym PR do main sprawdzamy sekrety, podatności, build i testy.
# Każdy job jest osobnym wymaganym checkiem w ochronie main, więc PR z błędem nie zostanie scalony.
# Joby kolejnych osób (frontend, backend, migracje, zależności) dopisujemy pod secret-scan – z needs: secret-scan,
# żeby budowanie ruszało dopiero, gdy w kodzie nie ma sekretów.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Sekrety (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # cała historia: sekret usunięty w późniejszym commicie też jest wyciekiem

      # Obraz Gitleaks zamiast gitleaks-action: akcja wymaga licencji dla repozytoriów organizacji.
      # --redact: znalezione wartości nie trafiają do logów publicznego repozytorium.
      # --log-opts=HEAD: historia sprawdzanego commita (main + zmiany z PR), a nie wszystkie gałęzie w repo –
      # inaczej sekret z cudzej, niescalonej gałęzi blokowałby każdy PR.
      - name: Gitleaks – cała historia repozytorium
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=HEAD --redact --no-banner --verbose --exit-code 1

  # Frontend (#64): te same kroki co lokalnie przed PR. npm ci instaluje dokładnie wersje z package-lock.json
  # i przerywa, gdy lockfile nie zgadza się z package.json. Build to tsc -b + vite build, więc błąd typów też go zatrzymuje.
  frontend:
    name: Frontend (lint + build)
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności (npm ci)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  # Migracje Alembica na prawdziwym PostgreSQL 16 (ta sama wersja co w Azure):
  # upgrade → zgodność z modelami → downgrade → upgrade → seed. SQLite nie wyłapie np. typów ENUM czy kolejności DROP.
  migrations:
    name: Migracje (PostgreSQL 16)
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clouddesk
          POSTGRES_DB: clouddesk_test
          # Jednorazowa baza w kontenerze runnera, dostępna tylko z localhost – bez hasła, żeby nie trzymać go w repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clouddesk -d clouddesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clouddesk@localhost:5432/clouddesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Alembic upgrade/downgrade na PostgreSQL 16
        run: pytest tests/test_migrations.py -v -rs --junitxml="$RUNNER_TEMP/migrations.xml"

      # Test sam się pomija, gdy nie widzi bazy. W CI pominięcie oznacza błąd konfiguracji, więc traktujemy je jak porażkę.
      - name: Wariant PostgreSQL faktycznie wykonany
        run: |
          python - "$RUNNER_TEMP/migrations.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse(sys.argv[1]).getroot().iter("testcase")
          pg = [c for c in cases if "postgresql" in c.get("name", "")]
          skipped = [c.get("name") for c in pg if c.find("skipped") is not None]
          if not pg or skipped:
              sys.exit(f"Test migracji na PostgreSQL nie wykonał się (pominięte: {skipped or 'brak testu'})")
          print(f"PostgreSQL: wykonano {len(pg)} test(y) migracji")
          EOF

  # Znane podatności (CVE) w bibliotekach frontendu i backendu. Czerwony job = jest poprawka, której nie mamy.
  dependencies:
    name: Podatności zależności (Trivy)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # requirements*.txt mają zakresy (np. fastapi==0.118.*), których Trivy nie rozpoznaje – bez tego kroku
      # backend w ogóle nie trafia do raportu. Instalujemy zależności jak w obrazie Dockera i zapisujemy dokładne
      # wersje. Plik musi nazywać się requirements.txt, bo Trivy wykrywa projekty pip tylko po tej nazwie.
      # Frontend nie potrzebuje tego kroku: package-lock.json ma już dokładne wersje.
      - name: Dokładne wersje zależności backendu (pip freeze)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r backend/requirements-dev.txt
          mkdir -p backend/.resolved
          "$RUNNER_TEMP/venv/bin/pip" freeze > backend/.resolved/requirements.txt
          cat backend/.resolved/requirements.txt

      - name: Trivy – podatności CRITICAL/HIGH z dostępną poprawką
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
