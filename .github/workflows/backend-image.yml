# Obraz backendu: build linux/amd64 → skan Trivy → GHCR.
# PR: tylko build i skan (bramka jakości). main: build, skan i publikacja jako sha-<commit> + latest.
# Terraform wskazuje obraz po skrócie sha256 (digest), więc podmiana tagu nie zmienia tego, co działa w Azure.
name: Backend image

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clouddesk-backend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Najpierw budujemy lokalnie w runnerze, żeby Trivy przeskanował dokładnie ten obraz, który potem wypchniemy.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: clouddesk-backend:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bramka: krytyczne podatności z dostępną poprawką albo sekret w obrazie zatrzymują pipeline.
      - name: Trivy – podatności i sekrety
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: clouddesk-backend:scan
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Logowanie do GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Publikacja w GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Podsumowanie
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Obraz backendu"
            echo "Do \`backend_image\` w Terraformie:"
            echo '```'
            echo "${IMAGE}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
