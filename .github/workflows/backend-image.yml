# Obraz backendu w PR: build linux/amd64 → skan Trivy (bramka jakości przed merge), bez publikacji.
# Obraz na produkcję buduje, skanuje i publikuje w GHCR job `backend-image` w deploy.yml – z SHA commita (GIT_SHA dla /health)
# i po zielonym CI. Wcześniej ten workflow publikował przy pushu na main drugi, równoległy obraz (`latest` bez SHA).
name: Backend image

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-image.yml"]

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Id joba bez zmian (pod nim widać check w PR-ach); obrazu nie publikuje – to robi Deploy.
  build-scan-push:
    name: Build i skan obrazu (bez publikacji)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Budujemy lokalnie w runnerze i skanujemy dokładnie ten obraz.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: clouddesk-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bramka: krytyczne podatności z dostępną poprawką albo sekret w obrazie zatrzymują pipeline.
      - name: Trivy – podatności i sekrety
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: clouddesk-backend:scan
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
