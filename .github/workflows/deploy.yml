# CD (Blok 8): po zielonym CI na main wdrażamy do Azure – bez haseł, logowanie przez OIDC.
#   1. backend-image  – obraz backendu z SHA commita → skan Trivy → GHCR
#   2. deploy-backend – migracje bazy nowym obrazem → nowy obraz w Container Apps → czekamy na zdrową rewizję
#   3. deploy-web     – build frontendu z SHA w stopce → paczka na vm-web w kawałkach przez az vm run-command → sprawdzenie strony
#   4. e2e-tests      – testy API (Jest + Supertest) i E2E (Playwright) na wdrożonej aplikacji, raporty jako artefakty
# Joby z dostępem do Azure działają w środowisku GitHub „azure” (tylko gałąź main); tylko ono dostaje token,
# który Entra ID przyjmuje (federated credential w terraform/cicd.tf).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Wdrożenia po kolei, bez przerywania trwającego (przerwany deploy mógłby zostawić Azure w połowie zmian).
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/clouddesk-backend
  # workflow_run: commit, który przeszedł CI; ręczne uruchomienie: bieżący main.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  RG: rg-clouddesk
  BACKEND_APP: ca-clouddesk-backend
  WEB_VM: vm-web
  WEB_PIP: pip-web

jobs:
  backend-image:
    name: Obraz backendu
    # Tylko po udanym CI dla pusha na main (nie dla PR) albo ręcznie.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: clouddesk-backend:scan
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy – podatności i sekrety w obrazie
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: clouddesk-backend:scan
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Publikacja w GHCR (tag sha-<commit>)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha

  deploy-backend:
    name: Wdrożenie backendu (Container Apps)
    needs: backend-image
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write # token OIDC dla azure/login
    steps:
      - name: Logowanie do Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Skrypt migracji z repozytorium – ta sama wersja co wdrażany kod.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: scripts

      # Migracje przed podmianą backendu: nowy kod może wymagać nowych kolumn. Przez chwilę stary backend działa
      # na nowym schemacie, więc migracje muszą być zgodne wstecz (najpierw dodajemy, usuwamy w kolejnym wydaniu).
      # Błąd migracji kończy job tutaj – backend zostaje na poprzednim obrazie.
      - name: Migracje bazy (alembic upgrade head)
        shell: bash # -o pipefail: błąd skryptu nie zginie za `| tee`
        env:
          NEW_IMAGE: ${{ needs.backend-image.outputs.image }}
          JOB: caj-clouddesk-migrate
        run: |
          # Zadanie dostaje nowy obraz na stałe, więc ręczne uruchomienie skryptu też użyje wdrożonej wersji.
          az containerapp job update -g "$RG" -n "$JOB" --image "$NEW_IMAGE" -o none
          scripts/azure-migrate.sh | tee "$RUNNER_TEMP/migrate.log"
          {
            echo "### Migracje bazy"
            echo "\`$(head -n1 "$RUNNER_TEMP/migrate.log")\` → zakończone powodzeniem"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nowy obraz w Container Apps
        env:
          NEW_IMAGE: ${{ needs.backend-image.outputs.image }}
        run: |
          az containerapp update -g "$RG" -n "$BACKEND_APP" --image "$NEW_IMAGE" -o none
          for _ in $(seq 1 30); do
            # paste (a nie tr '\n' ' ') zostawia końcowy znak nowej linii: bez niego read zwraca kod 1
            # i w powłoce z -e krok kończy się błędem od razu, mimo że zmienne są już ustawione.
            read -r latest ready image < <(az containerapp show -g "$RG" -n "$BACKEND_APP" --query \
              "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.template.containers[0].image]" -o tsv | paste -sd ' ')
            if [[ "$latest" == "$ready" && "$image" == "$NEW_IMAGE" ]]; then
              echo "Rewizja $ready działa z obrazem $image"
              echo "### Backend: rewizja \`$ready\`" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$image\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Nowa rewizja nie jest gotowa po 5 minutach (najnowsza: $latest, gotowa: $ready)." >&2
          exit 1

  deploy-web:
    name: Wdrożenie frontendu (vm-web)
    # Po backendzie: nowy frontend może korzystać z nowego API, a sprawdzenie /api/health widzi już nowy commit.
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      contents: read
      id-token: write # token OIDC dla azure/login
    outputs:
      url: ${{ steps.verify.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ten sam skrypt co przy ręcznym wdrożeniu (config/README.md); SHA trafia do stopki strony.
      - name: Build i paczka frontendu
        env:
          VITE_APP_VERSION: ${{ env.SHA }}
          # Przyciski kont demo na ekranie logowania (wpisują e-mail; hasło i tak trzeba podać) – na prezentację.
          VITE_DEMO_ACCOUNTS: 'true'
        run: config/package-web.sh "$RUNNER_TEMP/web.tgz"

      - name: Logowanie do Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Port 22 jest zamknięty w NSG, więc paczka jedzie w treści skryptów run-command (base64) – bez SSH
      # i bez dodatkowego magazynu plików. Treść jednego skryptu ma limit, dlatego paczkę dzielimy na kawałki
      # (config/web-run-scripts.sh): kolejne wywołania dopisują je na VM, ostatnie sprawdza SHA-256 całości
      # i wdraża. Adres backendu bierzemy z Container Apps przy każdym wdrożeniu, więc nie trzymamy go
      # w repozytorium ani w sekretach.
      - name: Wdrożenie na vm-web (az vm run-command)
        run: |
          fqdn="$(az containerapp show -g "$RG" -n "$BACKEND_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          [[ "$fqdn" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Brak poprawnego adresu ingress backendu: '$fqdn'." >&2; exit 1; }
          # Publiczna nazwa DNS VM – na nią wystawiony jest certyfikat TLS i na nią przekierowuje port 80.
          domain="$(az network public-ip show -g "$RG" -n "$WEB_PIP" --query dnsSettings.fqdn -o tsv)"
          [[ "$domain" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Brak poprawnej nazwy DNS dla $WEB_PIP: '$domain'." >&2; exit 1; }

          config/web-run-scripts.sh "$RUNNER_TEMP/web.tgz" "$RUNNER_TEMP/run" "https://$fqdn" "$domain" "$SHA"
          scripts=("$RUNNER_TEMP"/run/run-*.sh)
          # Treść każdego skryptu idzie w jednym żądaniu do API Azure – pilnujemy limitu dla każdego z osobna.
          for s in "${scripts[@]}"; do
            size="$(stat -c %s "$s")"
            echo "$(basename "$s"): $size B"
            (( size <= 200000 )) || { echo "Skrypt $(basename "$s") za duży dla run-command ($size B > 200000 B)." >&2; exit 1; }
          done

          # run-command kończy się sukcesem nawet wtedy, gdy skrypt na VM padnie: sukces rozpoznajemy po komunikacie
          # na końcu skryptu („Część i/N zapisana”, a w ostatnim – „Frontend wdrożony” z deploy-web.sh, który
          # pojawia się dopiero po udanym `nginx -t` i przeładowaniu Nginx).
          last=$(( ${#scripts[@]} - 1 ))
          for i in "${!scripts[@]}"; do
            out="$(az vm run-command invoke -g "$RG" -n "$WEB_VM" --command-id RunShellScript \
              --scripts @"${scripts[$i]}" --query 'value[0].message' -o tsv)"
            if (( i < last )); then
              grep -q "Część $(( i + 1 ))/${#scripts[@]} zapisana" <<<"$out" || { echo "$out"; echo "Przesłanie części $(( i + 1 )) na $WEB_VM nie powiodło się." >&2; exit 1; }
              echo "Część $(( i + 1 ))/${#scripts[@]} na $WEB_VM"
            else
              echo "$out"
              grep -q "Frontend wdrożony" <<<"$out" || { echo "Wdrożenie na $WEB_VM nie powiodło się." >&2; exit 1; }
            fi
          done

      # Z zewnątrz, tak jak użytkownik: przekierowanie HTTP → HTTPS, ważny certyfikat (curl go weryfikuje),
      # nowy bundle z SHA w stopce i /api/health przez Nginx.
      - name: Sprawdzenie strony (HTTPS) i /api/health
        id: verify
        run: |
          host="$(az network public-ip show -g "$RG" -n "$WEB_PIP" --query dnsSettings.fqdn -o tsv)"
          [[ -n "$host" ]] || { echo "Brak nazwy DNS dla $WEB_PIP." >&2; exit 1; }
          url="https://$host"
          redirect="$(curl -sS -o /dev/null --max-time 15 --retry 5 --retry-all-errors --retry-delay 5 \
            -w '%{http_code} %{redirect_url}' "http://$host/tickets?page=2" || true)"
          echo "HTTP → $redirect"
          [[ "$redirect" == "301 $url/tickets?page=2" ]] || { echo "Port 80 nie przekierowuje na HTTPS: '$redirect'." >&2; exit 1; }
          # -verify_return_error: niezaufany albo niepasujący certyfikat przerywa połączenie, więc $cert jest pusty.
          cert="$(timeout 20 openssl s_client -connect "$host:443" -servername "$host" -verify_hostname "$host" \
            -verify_return_error </dev/null 2>/dev/null | openssl x509 -noout -issuer -enddate 2>/dev/null | paste -sd ';' - || true)"
          [[ -n "$cert" ]] || { echo "Brak ważnego certyfikatu TLS dla $host." >&2; exit 1; }
          echo "Certyfikat: $cert"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/index.html" "$url/"
          bundle="$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' "$RUNNER_TEMP/index.html" | head -n1)"
          [[ -n "$bundle" ]] || { echo "Brak bundla JS w index.html." >&2; exit 1; }
          curl -fsS -o "$RUNNER_TEMP/bundle.js" "$url$bundle"
          grep -q "$SHA" "$RUNNER_TEMP/bundle.js" || { echo "Strona nie zawiera SHA $SHA." >&2; exit 1; }
          # Pierwsze zapytanie po podmianie backendu bywa wolne (zimny start Container Apps), a ruch może
          # jeszcze chwilę trafiać do starej rewizji – kilka prób, zanim uznamy, że wdrożenie się nie udało.
          for i in $(seq 1 6); do
            health="$(curl -fsS --max-time 30 "$url/api/health" || true)"
            commit="$(jq -r '.commit // empty' <<<"$health" 2>/dev/null || true)"
            echo "Próba $i: ${health:-brak odpowiedzi}"
            [[ "$commit" == "$SHA" ]] && break
            sleep 10
          done
          [[ "$commit" == "$SHA" ]] || { echo "/api/health: commit '${commit:-?}' zamiast $SHA." >&2; exit 1; }
          {
            echo "### Frontend: \`$url\`"
            echo "Strona i \`/api/health\` → 200, commit \`$SHA\`"
            echo "HTTP → 301 na HTTPS; certyfikat: $cert"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: Testy API i E2E (na wdrożonej aplikacji)
    # Po deploy-web: aplikacja odpowiada już nowym commitem (sprawdzone wyżej). Testy idą z zewnątrz, jak użytkownik.
    # Świadomie: czerwony wynik nie cofa wdrożenia (nowa wersja już działa) – sygnalizuje błąd do naprawy kolejnym
    # commitem. Testy są w tym samym przebiegu, więc kolejny deploy czeka na ich koniec (concurrency, maks. 20 min).
    needs: deploy-web
    runs-on: ubuntu-latest
    # Środowisko „azure” tylko po sekrety konta testowego (TEST_USER_*). Bez id-token: job nie loguje się do Azure.
    environment: azure
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    env:
      LIVE_APP_URL: ${{ needs.deploy-web.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Zależności testów
        run: npm ci

      # Wersja przeglądarki pasuje do @playwright/test z package-lock.json; --with-deps doinstalowuje biblioteki systemowe.
      - name: Przeglądarka Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Sekrety konta testowego tylko w krokach z testami – nie widzą ich `npm ci` (skrypty instalacyjne paczek)
      # ani instalacja przeglądarki.
      - name: Testy API (Jest + Supertest)
        id: api
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx jest --ci

      # E2E uruchamiamy także po nieudanych testach API – wtedy raport pokazuje pełny obraz, a nie tylko pierwszy błąd.
      # --trace off: repozytorium jest publiczne, a artefakty może pobrać każdy zalogowany użytkownik GitHuba. Trace
      # zapisuje wpisane wartości (np. hasło w formularzu logowania) i treść żądań – GitHub maskuje sekrety tylko
      # w logach, nie w artefaktach. Zrzuty i wideo zostają (pole hasła jest na nich zamaskowane).
      - name: Testy E2E (Playwright)
        id: e2e
        if: ${{ !cancelled() && steps.api.outcome != 'skipped' }}
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test --trace off

      # Raport HTML zawsze (także przy sukcesie – dowód przebiegu); zrzuty i wideo tylko przy błędach.
      - name: Raport Playwright (artefakt)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # run_attempt: ponowne uruchomienie joba nie koliduje z artefaktem z poprzedniej próby.
          name: playwright-report-${{ env.SHA }}-${{ github.run_attempt }}
          path: tests/playwright-report/
          retention-days: 14
          if-no-files-found: warn

      # Zrzuty i wideo powstają tylko dla nieudanych prób – także wtedy, gdy test przeszedł dopiero przy powtórce
      # (niestabilny test), dlatego warunkiem jest istnienie plików, a nie wynik kroku.
      - name: Zrzuty i wideo z nieudanych testów (artefakt)
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures-${{ env.SHA }}-${{ github.run_attempt }}
          path: tests/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Podsumowanie
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Testy na \`$LIVE_APP_URL\`"
            echo "- API (Jest): **${{ steps.api.outcome }}**"
            echo "- E2E (Playwright): **${{ steps.e2e.outcome }}**"
            echo "Raport HTML: artefakt \`playwright-report-$SHA-$GITHUB_RUN_ATTEMPT\` (sekcja *Artifacts* na dole tej strony)."
          } >> "$GITHUB_STEP_SUMMARY"
