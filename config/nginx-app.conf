# Wspólna część serwera CloudDesk: statyczny React i reverse proxy /api do backendu w Private Subnet A.
# Na VM trafia jako /etc/nginx/snippets/clouddesk-app.conf (config/deploy-web.sh) i jest dołączana
# przez `include` do serwera HTTPS (nginx.conf) albo – przed pierwszym certyfikatem – HTTP (nginx-http.conf).
# Backend nie ma publicznego adresu – jedyną drogą do niego jest ten reverse proxy.

root /var/www/clouddesk;
index index.html;

# HSTS: przeglądarka przez rok łączy się z tą domeną tylko po HTTPS. Przez HTTP nagłówek jest ignorowany,
# więc na etapie przed certyfikatem niczego nie psuje.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location / {
    try_files $uri /index.html;
}

# Vite dodaje hash do nazw plików w /assets, więc mogą być cache'owane długo.
# add_header w location wyłącza dziedziczenie nagłówków z poziomu serwera, dlatego są powtórzone.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

location /api/ {
    # Adres backendu rozwiązujemy przy każdym zapytaniu (zmienna + resolver), a nie raz przy starcie:
    # gdy DNS chwilowo nie odpowie przy restarcie Nginx, strona działa, a /api wraca 502 do czasu
    # odpowiedzi DNS. 168.63.129.16 to DNS platformy Azure – widzi prywatne strefy VNet.
    resolver 168.63.129.16 valid=30s ipv6=off;
    resolver_timeout 5s;
    # Sam adres, bez ścieżki i końcowego "/": wtedy backend dostaje pełne /api/... .
    set $backend ${BACKEND_INTERNAL_URL};   # adres wewnętrzny Container Apps (ingress internal)
    proxy_pass $backend;
    # Domyślne HTTP/1.0 Envoy w Container Apps odrzuca kodem 426 Upgrade Required.
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Przy adresie https:// ingress Container Apps wybiera certyfikat po nazwie hosta (SNI).
    proxy_ssl_server_name on;
}
