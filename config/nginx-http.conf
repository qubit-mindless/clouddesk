# Warstwa WEB – konfiguracja przejściowa, zanim powstanie certyfikat (pierwsze wdrożenie na nowej VM).
# Strona działa po HTTP jak dotąd, a certbot może przejść wyzwanie HTTP-01 przez /.well-known/acme-challenge/.
# Po pobraniu certyfikatu deploy-web.sh od razu podmienia ją na nginx.conf (HTTPS + przekierowanie 80 → 443).
# Limit prób logowania (ochrona haseł przed zgadywaniem): klucz = adres klienta tylko dla /api/auth/login;
# pozostałe żądania mają pusty klucz i nie są liczone. 10 prób na minutę z jednego adresu, 10 na zapas
# (kilka osób zza jednego NAT, np. sala na prezentacji). Strefę definiuje plik serwera (kontekst http),
# a sam limit – location /api/ w nginx-app.conf. Aktywny jest zawsze tylko jeden z plików serwera.
# $uri, nie $request_uri: ścieżka już zdekodowana i znormalizowana przez Nginx (%6C → l, // → /, ./ → nic, bez ?…),
# tak jak zobaczy ją backend – inaczej limit dałoby się obejść np. adresem /api/auth/%6Cogin.
map $uri $login_limit_key {
    ~^/api/auth/login/?$ $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    include /etc/nginx/snippets/clouddesk-app.conf;
}
