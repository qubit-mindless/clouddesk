#cloud-config
# Pierwsze uruchomienie VM w snet-web (Ubuntu): instaluje Nginx i przygotowuje miejsce na frontend.
# Sam build wgrywa później deploy-web.sh (ręcznie teraz, z pipeline'u od Bloku 08).
# W Terraformie: custom_data = filebase64("${path.module}/../config/cloud-init-web.yaml")
package_update: true
packages:
  - nginx
  - gettext-base # envsubst do wstawienia adresu backendu w nginx.conf

runcmd:
  # Domyślna strona Ubuntu zajmuje port 80 jako default_server; zostaje tylko nasza konfiguracja.
  - rm -f /etc/nginx/sites-enabled/default
  - mkdir -p /etc/clouddesk /usr/share/nginx/html
  - systemctl enable --now nginx
