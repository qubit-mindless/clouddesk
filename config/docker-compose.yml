# Lokalne środowisko deweloperskie: PostgreSQL odpowiadający bazie w Azure (Private Subnet B).
# Uruchomienie: docker compose -f config/docker-compose.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clouddesk
      POSTGRES_PASSWORD: clouddesk   # tylko lokalnie; w chmurze hasło trzyma Key Vault
      POSTGRES_DB: clouddesk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
