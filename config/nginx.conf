# Warstwa WEB (Public Subnet): serwuje zbudowany React i przekazuje /api do backendu
# w Private Subnet A. Backend nie ma publicznego adresu – jedyną drogą jest ten reverse proxy.
server {
    listen 80;
    server_name _;
    # Blok 9: tu dojdzie przekierowanie 80 -> 443 i certyfikat TLS.

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass ${BACKEND_INTERNAL_URL};   # adres wewnętrzny Container Apps (ingress internal)
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
