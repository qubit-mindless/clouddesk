# Warstwa WEB (Public Subnet) – docelowa konfiguracja z HTTPS.
# Na VM trafia jako /etc/nginx/sites-available/clouddesk (config/deploy-web.sh), gdy certyfikat Let's Encrypt
# dla ${WEB_DOMAIN} już istnieje. Wcześniej deploy-web.sh używa nginx-http.conf i pobiera certyfikat.

# Port 80: tylko wyzwania ACME (odnawianie certyfikatu przez certbota) i stałe przekierowanie na HTTPS.
# Limit prób logowania (ochrona haseł przed zgadywaniem): klucz = adres klienta tylko dla /api/auth/login i /api/auth/password
# (zmiana hasła sprawdza obecne hasło – bez limitu dałoby się je zgadywać z cudzego, otwartego tokenu);
# pozostałe żądania mają pusty klucz i nie są liczone. 10 prób na minutę z jednego adresu, 10 na zapas
# (kilka osób zza jednego NAT, np. sala na prezentacji). Strefę definiuje plik serwera (kontekst http),
# a sam limit – location /api/ w nginx-app.conf. Aktywny jest zawsze tylko jeden z plików serwera.
# $uri, nie $request_uri: ścieżka już zdekodowana i znormalizowana przez Nginx (%6C → l, // → /, ./ → nic, bez ?…),
# tak jak zobaczy ją backend – inaczej limit dałoby się obejść np. adresem /api/auth/%6Cogin.
map $uri $login_limit_key {
    ~^/api/auth/(login|password)/?$ $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # Zawsze na nazwę z certyfikatu – także przy wejściu po samym IP.
    location / {
        return 301 https://${WEB_DOMAIN}$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/${WEB_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${WEB_DOMAIN}/privkey.pem;
    # Tylko TLS 1.2 i 1.3. Dla TLS 1.2 wyłącznie szyfry AEAD z ECDHE (poufność przyszła);
    # TLS 1.3 ma własny, bezpieczny zestaw i ta lista go nie dotyczy.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/clouddesk-app.conf;
}
