# Warstwa WEB (Public Subnet): serwuje zbudowany React i przekazuje /api do backendu
# w Private Subnet A. Backend nie ma publicznego adresu – jedyną drogą jest ten reverse proxy.
# Na VM trafia jako /etc/nginx/sites-available/clouddesk (config/deploy-web.sh) i zastępuje
# tymczasową stronę z terraform/cloud-init-web.yaml.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    # Blok 9: tu dojdzie przekierowanie 80 -> 443 i certyfikat TLS.

    root /var/www/clouddesk;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri /index.html;
    }

    # Vite dodaje hash do nazw plików w /assets, więc mogą być cache'owane długo.
    # add_header w location wyłącza dziedziczenie nagłówków z server, dlatego są powtórzone.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/ {
        # Sam adres, bez ścieżki i końcowego "/": wtedy backend dostaje pełne /api/... .
        proxy_pass ${BACKEND_INTERNAL_URL};   # adres wewnętrzny Container Apps (ingress internal)
        # Domyślne HTTP/1.0 Envoy w Container Apps odrzuca kodem 426 Upgrade Required.
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Przy adresie https:// ingress Container Apps wybiera certyfikat po nazwie hosta (SNI).
        proxy_ssl_server_name on;
    }
}
